name: dozetone
description: "Offline music player for Android with a smart sleep timer."
publish_to: "none" # Prevents accidental publishing to pub.dev

# Version 1.0.0, build number 1
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # Flutter core SDK
  flutter:
    sdk: flutter

  # Localization support for Flutter applications
  # Used with ARB files and gen-l10n for type-safe internationalized strings
  flutter_localizations:
    sdk: flutter

  # Date/time and message formatting used by flutter_localizations
  intl: ^0.20.2

  # State management and dependency injection
  # Used for plain NotifierProvider and AsyncNotifierProvider without code generation
  flutter_riverpod: ^2.6.1

  # Declarative routing and URL-based navigation
  # Handles deep-linking and clean navigation between screens
  go_router: ^14.8.1

  # Feature-rich audio player for local music playback
  # Supports precise audio position tracking and volume ducking/fading
  just_audio: ^0.10.6

  # Background audio playback and system media notification controls
  # Keeps audio running when the screen is off or the app is minimized
  audio_service: ^0.18.19

  # Audio focus and interruption management (calls, navigation alerts)
  audio_session: ^0.2.4

  # Runtime Android permission handling (READ_MEDIA_AUDIO, POST_NOTIFICATIONS)
  permission_handler: ^11.4.0

  # Accelerometer sensor access for the shake-to-extend sleep timer feature
  sensors_plus: ^6.1.1

  # Key-value persistent storage for user settings and playback state
  shared_preferences: ^2.5.3

  # Vector drawable (SVG) rendering for crisp icons and vector logos
  flutter_svg: ^2.0.17

dev_dependencies:
  # Flutter testing framework
  flutter_test:
    sdk: flutter

  # Recommended lint rules for high code quality and consistency
  flutter_lints: ^6.0.0

  # Automation tool to generate Android adaptive and standard launcher icons
  flutter_launcher_icons: ^0.14.3

  # Automation tool to configure Android native splash screen
  flutter_native_splash: ^2.4.4

# Flutter-specific configurations
flutter:
  # Enables Material Design components and default icons
  uses-material-design: true

  # Enables code generation for synthetic localization packages (gen-l10n)
  generate: true

  # Asset bundles included in the app binary
  assets:
    - assets/icons/
    - assets/images/

  # Custom offline typography bundled directly with the application
  # Note: Uncomment when Poppins font files (.ttf) are placed in assets/fonts/
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600

# Configuration for flutter_launcher_icons
# Sets up Midnight Blue adaptive background and transparent foreground
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/dozetone_app_icon.png"
  adaptive_icon_background: "#0F1424"
  adaptive_icon_foreground: "assets/images/dozetone_icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/dozetone_icon_foreground.png"

# Configuration for flutter_native_splash
# Displays the brand icon on Midnight Blue background during native boot
flutter_native_splash:
  color: "#0F1424"
  image: "assets/images/dozetone_icon_foreground.png"
  android: true
  ios: false
  web: false
  android_12:
    image: "assets/images/dozetone_icon_foreground.png"
    color: "#0F1424"
